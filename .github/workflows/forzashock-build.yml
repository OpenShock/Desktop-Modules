name: ForzaShock / Build

on:
  push:
    branches: ['**']
    paths:
      - 'ForzaShock/**'
      - '.github/workflows/forzashock-build.yml'
  pull_request:
    paths:
      - 'ForzaShock/**'
      - '.github/workflows/forzashock-build.yml'
  workflow_dispatch:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ForzaShock/ForzaShock.csproj

      - name: Publish & pack module
        run: dotnet publish ForzaShock/ForzaShock.csproj --configuration Release --no-restore -o publish

      - name: Upload module artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: OpenShock.Desktop.Modules.ForzaShock.module
          path: publish/OpenShock.Desktop.Modules.ForzaShock.module.zip
          if-no-files-found: error
