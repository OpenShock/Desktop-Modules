name: ForzaShock / Release

on:
  push:
    tags:
      - 'forzashock/[0-9]+.[0-9]+.[0-9]+'
      - 'forzashock/[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

jobs:
  build:
    uses: ./.github/workflows/forzashock-build.yml

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !contains(github.ref_name, '-rc.') }}
    permissions:
      contents: write
    steps:
      - name: Extract version
        id: ver
        run: echo "version=${GITHUB_REF_NAME#forzashock/}" >> "$GITHUB_OUTPUT"

      - name: Download module artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenShock.Desktop.Modules.ForzaShock.module
          path: artifacts/

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          TITLE: ForzaShock ${{ steps.ver.outputs.version }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TITLE" \
            --draft \
            --generate-notes \
            artifacts/OpenShock.Desktop.Modules.ForzaShock.module.zip
